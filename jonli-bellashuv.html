<!doctype html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jonli bellashuv — o‘quvchi bo‘limi</title>
<style>body{margin:0;padding:18px;background:#eef3fb;font-family:system-ui,-apple-system,Segoe UI,sans-serif}</style></head><body>

<!-- ===== JONLI BELLASHUV (O‘QUVCHI) — BOSHLANISH =====
     Shu qatordan "TUGASH" qatorigacha bo‘lgan qismni index.html ga ko‘chiring.
     Hech qanday boshqa kodga bog‘liq emas (barcha nomlar kh/.khl bilan boshlanadi). -->
<style>
.khl{--kh-ink:#0f2146;--kh-muted:#5b6b88;--kh-line:#d6e2f7;--kh-blue:#1368ce;--kh-red:#e21b3c;--kh-yel:#d89e00;--kh-grn:#26890c;--kh-pur:#46178f;position:relative;box-sizing:border-box;margin:0 0 20px;padding:20px;border:1px solid #cfe0fb;border-radius:20px;background:linear-gradient(180deg,#f3f8ff,#fff);color:var(--kh-ink);font-family:inherit;font-size:16px;line-height:1.45;overflow:hidden}
.khl *,.khl *::before,.khl *::after{box-sizing:border-box}
.khl [hidden]{display:none!important}
.khl button,.khl input{all:unset;box-sizing:border-box;font:inherit;color:inherit}
.khl .kh-head{display:flex;align-items:center;gap:10px;margin:0 0 6px}
.khl .kh-head h2{margin:0;font-size:22px;font-weight:800;color:var(--kh-ink)}
.khl .kh-sub{margin:0 0 14px;color:var(--kh-muted)}
.khl .kh-input{display:block;width:100%;padding:14px 16px;margin:0 0 12px;border:2px solid #c3d3ee;border-radius:14px;background:#fff;font-size:18px;color:var(--kh-ink);cursor:text}
.khl .kh-input:focus{border-color:var(--kh-blue);box-shadow:0 0 0 3px #1368ce22}
.khl .kh-code{text-align:center;letter-spacing:.35em;font-weight:800;font-size:26px;text-transform:uppercase}
.khl .kh-btn{display:block;width:100%;padding:14px 18px;border-radius:14px;background:var(--kh-pur);color:#fff;font-weight:800;text-align:center;cursor:pointer;box-shadow:0 4px 0 #2b0d58;user-select:none}
.khl .kh-btn:active{transform:translateY(2px);box-shadow:0 2px 0 #2b0d58}
.khl .kh-btn[disabled]{opacity:.5;cursor:not-allowed}
.khl .kh-link{display:inline-block;margin-top:10px;color:var(--kh-blue);font-weight:700;cursor:pointer;text-decoration:underline}
.khl .kh-note{margin-top:12px;min-height:1.2em;color:#b42318;font-weight:600;text-align:center}
.khl .kh-roominfo{margin:0 0 12px;padding:10px 14px;border-radius:12px;background:#eaf1ff;color:var(--kh-ink)}
.khl .kh-center{text-align:center}
.khl .kh-pin{display:inline-block;padding:6px 16px;border-radius:12px;background:var(--kh-ink);color:#fff;font-weight:800;letter-spacing:.25em;font-size:22px}
.khl .kh-chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0}
.khl .kh-chip{padding:6px 12px;border-radius:999px;background:#fff;border:1px solid var(--kh-line);font-weight:700;font-size:14px}
.khl .kh-chip.me{background:var(--kh-pur);color:#fff;border-color:var(--kh-pur)}
.khl .kh-qmeta{display:flex;align-items:center;gap:8px;justify-content:space-between;margin-bottom:8px}
.khl .kh-pill{display:inline-block;padding:4px 12px;border-radius:999px;background:#e5edff;color:#23409a;font-weight:700;font-size:14px}
.khl .kh-timer{display:flex;align-items:center;justify-content:center;min-width:46px;height:46px;border-radius:50%;background:var(--kh-pur);color:#fff;font-weight:800;font-size:20px}
.khl .kh-bar{height:10px;border-radius:999px;background:#dbe5f8;overflow:hidden;margin-bottom:14px}
.khl .kh-bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#46178f,#1368ce);transition:width .25s linear}
.khl .kh-count{text-align:center;font-size:84px;font-weight:900;color:var(--kh-pur);line-height:1;margin:6px 0 10px}
.khl .kh-qtext{margin:0 0 14px;text-align:center;font-size:clamp(20px,3.6vw,28px);font-weight:800;color:var(--kh-ink);line-height:1.3;word-break:break-word}
.khl .kh-qimg{display:block;max-width:100%;max-height:240px;margin:0 auto 14px;border-radius:12px}
.khl .kh-opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.khl .kh-opt{display:flex;align-items:center;gap:10px;min-height:84px;padding:12px 14px;border-radius:14px;color:#fff;font-weight:800;font-size:18px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.25);word-break:break-word}
.khl .kh-opt:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.khl .kh-opt[disabled]{opacity:.55;cursor:not-allowed}
.khl .kh-shape{flex:none;width:28px;text-align:center;font-size:26px}
.khl .kh-o0{background:var(--kh-red)}.khl .kh-o1{background:var(--kh-blue)}.khl .kh-o2{background:var(--kh-yel)}.khl .kh-o3{background:var(--kh-grn)}
.khl .kh-typebox{grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap}
.khl .kh-typebox .kh-input{flex:1 1 220px;width:auto;margin:0}
.khl .kh-typebox .kh-btn{flex:0 0 auto;width:auto}
.khl .kh-wait{padding:24px 12px;border-radius:16px;background:#fff;border:2px dashed var(--kh-line);text-align:center;color:var(--kh-muted)}
.khl .kh-wait b{display:block;font-size:22px;color:var(--kh-pur);margin-bottom:4px}
.khl .kh-res{border-radius:18px;padding:18px;text-align:center;color:#fff;margin-bottom:12px}
.khl .kh-res.ok{background:var(--kh-grn)}.khl .kh-res.bad{background:var(--kh-red)}.khl .kh-res.none{background:#5b6b88}
.khl .kh-res h3{margin:0;font-size:28px;font-weight:900;color:#fff}
.khl .kh-res p{margin:4px 0 0;font-size:18px;font-weight:700;color:#fff}
.khl .kh-ans{margin:0 0 12px;padding:12px 14px;border-radius:14px;background:#fff;border:1px solid var(--kh-line)}
.khl .kh-ans small{display:block;color:var(--kh-muted);font-weight:700;text-transform:uppercase;font-size:12px;letter-spacing:.04em}
.khl .kh-ans strong{font-size:20px;font-weight:800}
.khl .kh-dist{display:grid;gap:6px;margin:0 0 12px}
.khl .kh-dr{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700}
.khl .kh-dr .l{flex:none;width:26px;text-align:center}
.khl .kh-dr .t{flex:1;height:22px;border-radius:8px;background:#e9eefb;overflow:hidden}
.khl .kh-dr .t i{display:block;height:100%;min-width:3px}
.khl .kh-dr .c{flex:none;min-width:48px}
.khl .kh-lbh{margin:12px 0 6px;font-weight:800}
.khl .kh-row{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:12px;background:#fff;border:1px solid var(--kh-line);margin-bottom:6px;font-weight:700}
.khl .kh-row.me{background:#f1e9ff;border-color:#c9b0f5}
.khl .kh-row .n{flex:none;width:26px;text-align:center;color:var(--kh-muted)}
.khl .kh-row .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.khl .kh-row .sc{flex:none;font-variant-numeric:tabular-nums}
.khl .kh-next{text-align:center;color:var(--kh-muted);font-weight:700;margin-top:8px}
.khl .kh-podium{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin:14px 0}
.khl .kh-pod{flex:1;max-width:150px;text-align:center}
.khl .kh-pod .nm{font-weight:800;font-size:14px;word-break:break-word;margin-bottom:4px}
.khl .kh-pod .blk{border-radius:12px 12px 0 0;color:#fff;font-weight:900;font-size:28px;padding-top:8px}
.khl .kh-pod.p1 .blk{height:120px;background:#d89e00}
.khl .kh-pod.p2 .blk{height:90px;background:#7b8aa6}
.khl .kh-pod.p3 .blk{height:70px;background:#b4682e}
.khl .kh-pod .sc{font-size:13px;color:var(--kh-muted);font-weight:700;margin-top:4px}
@media(max-width:520px){.khl{padding:14px}.khl .kh-opt{min-height:72px;font-size:16px}.khl .kh-count{font-size:68px}}
@media(prefers-reduced-motion:reduce){.khl .kh-bar i{transition:none}}
</style>

<section id="khLive" class="khl" aria-live="polite">
  <div class="kh-head"><span aria-hidden="true">⚡</span><h2>Jonli bellashuv</h2></div>

  <div id="khJ1">
    <p class="kh-sub">Ustoz bergan xona kodini kiriting va bellashuvga qo‘shiling.</p>
    <input id="khCode" class="kh-input kh-code" type="text" maxlength="6" placeholder="XONA KODI" autocomplete="off" autocapitalize="characters" spellcheck="false">
    <button id="khGo1" class="kh-btn" type="button">Davom etish</button>
  </div>

  <div id="khJ2" hidden>
    <div class="kh-roominfo">Xona: <b id="khRoomCode"></b><span id="khRoomTitle"></span></div>
    <input id="khName" class="kh-input" type="text" maxlength="50" placeholder="Ism va familiyangiz" autocomplete="name">
    <button id="khGo2" class="kh-btn" type="button">Bellashuvga qo‘shilish</button>
    <button id="khBack" class="kh-link" type="button">← Kodni o‘zgartirish</button>
  </div>

  <div id="khLobby" class="kh-center" hidden>
    <p class="kh-sub">Siz bellashuvga qo‘shildingiz!</p>
    <div>Xona kodi: <span class="kh-pin" id="khLobCode"></span></div>
    <h3 id="khLobName" class="kh-qtext" style="margin-top:14px"></h3>
    <div id="khLobCount" class="kh-pill"></div>
    <div id="khChips" class="kh-chips"></div>
    <div class="kh-wait"><b>O‘yin boshlanishini kuting…</b><span>Ustoz boshlagach, savollar o‘zi ketma-ket chiqadi.</span></div>
    <button id="khLeave" class="kh-link" type="button">Chiqish</button>
  </div>

  <div id="khPlay" hidden>
    <div class="kh-qmeta"><span id="khQn" class="kh-pill"></span><span id="khScore" class="kh-pill"></span><span id="khTime" class="kh-timer">0</span></div>
    <div class="kh-bar"><i id="khBar"></i></div>
    <div id="khCount" class="kh-count" hidden></div>
    <h3 id="khQtext" class="kh-qtext"></h3>
    <img id="khQimg" class="kh-qimg" alt="" hidden>
    <div id="khOpts" class="kh-opts"></div>
    <div id="khAnswered" class="kh-wait" hidden><b id="khWaitT"></b><span id="khWaitS"></span></div>
  </div>

  <div id="khReveal" hidden>
    <div id="khRes" class="kh-res none"><h3 id="khResT"></h3><p id="khResS"></p></div>
    <div class="kh-ans"><small>To‘g‘ri javob</small><strong id="khCorrect"></strong></div>
    <div id="khDist" class="kh-dist"></div>
    <div class="kh-center"><span id="khMyRank" class="kh-pill"></span></div>
    <div class="kh-lbh">🏆 Reyting</div>
    <div id="khTop"></div>
    <div id="khNext" class="kh-next"></div>
  </div>

  <div id="khEnd" hidden>
    <h3 class="kh-qtext">🏆 Bellashuv yakunlandi!</h3>
    <div id="khPodium" class="kh-podium"></div>
    <div class="kh-center"><span id="khEndMe" class="kh-pill"></span></div>
    <div class="kh-lbh">Yakuniy reyting</div>
    <div id="khFinal"></div>
    <button id="khAgain" class="kh-btn" type="button" style="margin-top:14px">Boshqa bellashuvga kirish</button>
  </div>

  <div id="khNote" class="kh-note"></div>
</section>

<script>
(function(){
'use strict';
// Apps Script veb-ilova manzili (testmarkazedu.uz dagi RESULT_API_URL bilan bir xil).
var API='https://script.google.com/macros/s/AKfycbwhAIWrqNJPK-tTajCs7Cj-dE7Hc0qVs6w0_qPrpLjHS5ZYOr9kIoeE6GN9Cx4WhFE/exec';
var LS_KEY='khLiveSession';
var SCREENS=['khJ1','khJ2','khLobby','khPlay','khReveal','khEnd'];
var SHAPES=['▲','◆','●','■'];
var COLORS=['#e21b3c','#1368ce','#d89e00','#26890c'];
var root=document.getElementById('khLive');
if(!root)return;
var S={pending:'',code:'',pid:'',name:'',offset:0,timer:null,tick:null,last:null,phase:'',sig:'',answered:false,busy:false,timeup:false,myAns:null,fails:0};

function $(id){return document.getElementById(id)}
function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function empty(n){while(n.firstChild)n.removeChild(n.firstChild)}
function nowS(){return Date.now()+S.offset}
function note(m){$('khNote').textContent=m||''}
function screen(id){SCREENS.forEach(function(k){$(k).hidden=(k!==id)})}
function busyBtn(id,v){if(v)$(id).setAttribute('disabled','');else $(id).removeAttribute('disabled')}
function save(v){try{if(v)localStorage.setItem(LS_KEY,JSON.stringify(v));else localStorage.removeItem(LS_KEY)}catch(e){}}
function loadSaved(){try{return JSON.parse(localStorage.getItem(LS_KEY)||'null')}catch(e){return null}}

function api(action,payload){
  var body=JSON.stringify(Object.assign({action:action},payload||{}));
  return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:body})
    .then(function(r){return r.text()})
    .then(function(t){var d;try{d=JSON.parse(t)}catch(e){throw new Error('Server javobi noto‘g‘ri')}
      if(!d||d.ok===false)throw new Error((d&&d.error)||'Server xatosi');return d});
}

/* ---------- Kirish: 1) xona kodi, 2) ism-familiya ---------- */
function step1(){
  var code=$('khCode').value.trim().toUpperCase();
  if(!/^[A-HJ-NP-Z2-9]{6}$/.test(code)){note('Xona kodi 6 ta belgidan iborat bo‘lishi kerak.');return}
  note('');busyBtn('khGo1',true);
  api('lbState',{code:code}).then(function(s){
    if(s.status!=='lobby')throw new Error('Bu bellashuv allaqachon boshlangan yoki yakunlangan.');
    S.pending=code;$('khRoomCode').textContent=code;$('khRoomTitle').textContent=s.title?(' · '+s.title):'';
    screen('khJ2');setTimeout(function(){$('khName').focus()},50);
  }).catch(function(e){note(e.message)}).then(function(){busyBtn('khGo1',false)});
}
function step2(){
  var name=$('khName').value.trim().replace(/\s+/g,' ');
  if(name.length<2){note('Ism-familiyangizni kiriting.');return}
  note('');busyBtn('khGo2',true);
  api('lbJoin',{code:S.pending,name:name}).then(function(r){
    S.code=S.pending;S.pid=r.playerId;S.name=r.name||name;save({code:S.code,pid:S.pid,name:S.name});begin();
  }).catch(function(e){note(e.message)}).then(function(){busyBtn('khGo2',false)});
}
function begin(){S.phase='';S.sig='';S.last=null;S.fails=0;stopLoops();S.tick=setInterval(tick,150);poll()}
function stopLoops(){clearTimeout(S.timer);clearInterval(S.tick);S.timer=null;S.tick=null}
function leave(msg){
  stopLoops();S.code='';S.pid='';S.pending='';S.last=null;S.phase='';S.sig='';save(null);
  $('khCode').value='';$('khName').value='';screen('khJ1');note(msg||'');
}

/* ---------- Serverdan holatni olish ---------- */
function poll(){
  if(!S.code)return;
  var t0=Date.now();
  api('lbState',{code:S.code,playerId:S.pid}).then(function(s){
    if(!S.code)return;
    S.offset=s.serverNow-(t0+Date.now())/2;S.fails=0;note('');apply(s);
  }).catch(function(e){
    if(!S.code)return;
    if(/Xona topilmadi/.test(e.message)){leave('Xona topilmadi yoki yopilgan.');return}
    S.fails++;note('Aloqa uzildi, qayta ulanmoqda…');
  }).then(function(){
    if(!S.code||(S.last&&S.last.status==='finished'))return;
    clearTimeout(S.timer);S.timer=setTimeout(poll,nextDelay());
  });
}
function nextDelay(){
  var base=2000+Math.random()*400,s=S.last,b=0;
  if(s){
    if(s.status==='question'&&s.question)b=s.question.endsAt;
    else if(s.status==='reveal')b=s.revealEndsAt;
  }
  if(b){var d=b-nowS()+250+Math.random()*350;if(d<base)return Math.max(400,d)}
  return base;
}

function me(s){var r=null;(s.players||[]).forEach(function(p){if(p.id===S.pid)r=p});return r}
function rankOf(s){var m=me(s);if(!m)return 0;var r=1;s.players.forEach(function(p){if(p.score>m.score)r++});return r}

function apply(s){
  S.last=s;
  var key=s.status+':'+s.questionIndex,m=me(s);
  $('khScore').textContent='Ball: '+(m?m.score:0);
  if(s.status==='lobby'){S.phase=key;renderLobby(s);screen('khLobby')}
  else if(s.status==='question'&&s.question){
    if(S.phase!==key){S.phase=key;renderQuestion(s)}
    else if(s.answered&&!S.answered){S.answered=true}
    screen('khPlay');tick();
  }
  else if(s.status==='reveal'&&s.reveal){
    var sig=JSON.stringify([key,s.players.map(function(p){return p.score}),s.reveal.dist||null,s.mine||null]);
    if(S.phase!==key||S.sig!==sig){S.phase=key;S.sig=sig;renderReveal(s)}
    screen('khReveal');tick();
  }
  else if(s.status==='finished'){S.phase=key;renderEnd(s);screen('khEnd');stopLoops();save(null)}
}

/* ---------- Kutish zali ---------- */
function renderLobby(s){
  $('khLobCode').textContent=S.code;$('khLobName').textContent=S.name;
  $('khLobCount').textContent=s.players.length+' ta ishtirokchi';
  var box=$('khChips');empty(box);
  s.players.forEach(function(p){box.appendChild(el('span','kh-chip'+(p.id===S.pid?' me':''),p.name))});
}

/* ---------- Savol ---------- */
function renderQuestion(s){
  var q=s.question;
  S.answered=!!s.answered;S.busy=false;S.timeup=false;S.myAns=null;
  $('khQn').textContent='Savol '+q.number+' / '+s.questionCount;
  $('khQtext').textContent=q.q;
  var im=$('khQimg');
  if(q.img){im.src=q.img;im.hidden=false}else{im.removeAttribute('src');im.hidden=true}
  var box=$('khOpts');empty(box);
  if(q.type==='type'){
    var w=el('div','kh-typebox'),inp=el('input','kh-input'),b=el('button','kh-btn','Yuborish');
    inp.type='text';inp.id='khType';inp.maxLength=100;inp.placeholder='Javobingizni yozing';inp.autocomplete='off';
    b.type='button';
    var go=function(){var v=inp.value.trim();if(!v){note('Javobni yozing.');return}submit({text:v})};
    b.onclick=go;inp.onkeydown=function(e){if(e.key==='Enter')go()};
    w.appendChild(inp);w.appendChild(b);box.appendChild(w);
  }else{
    q.options.forEach(function(t,i){
      var tf=q.type==='tf',cls=tf?(i===0?'kh-o1':'kh-o0'):('kh-o'+i),shape=tf?(i===0?'✔':'✖'):SHAPES[i];
      var b=el('button','kh-opt '+cls);b.type='button';
      b.appendChild(el('span','kh-shape',shape));b.appendChild(el('span','',t));
      b.onclick=function(){submit({choice:i})};box.appendChild(b);
    });
  }
}
function setDisabled(v){[].forEach.call($('khOpts').querySelectorAll('button,input'),function(n){if(v)n.setAttribute('disabled','');else n.removeAttribute('disabled')})}
function submit(payload){
  if(S.answered||S.busy)return;
  S.busy=true;note('');setDisabled(true);
  api('lbAnswer',Object.assign({code:S.code,playerId:S.pid},payload)).then(function(r){
    S.answered=true;S.myAns={correct:r.correct,points:r.points};tick();
  }).catch(function(e){
    var m=e.message||'Xatolik';
    if(/Vaqt tugadi|qabul qilinmayapti/.test(m)){S.answered=true;S.timeup=true;tick()}
    else{setDisabled(false);note(m)}
  }).then(function(){S.busy=false});
}

/* ---------- Taymer va holat (har 150 ms, serverga so‘rov yubormaydi) ---------- */
function tick(){
  var s=S.last;if(!s)return;
  var now=nowS();
  if(s.status==='question'&&s.question){
    var q=s.question,cnt=$('khCount'),opts=$('khOpts'),ans=$('khAnswered');
    if(now<q.startedAt){
      cnt.hidden=false;cnt.textContent=Math.max(1,Math.ceil((q.startedAt-now)/1000));
      opts.hidden=true;ans.hidden=true;$('khBar').style.width='100%';$('khTime').textContent=q.time;
    }else{
      cnt.hidden=true;
      var left=Math.max(0,q.endsAt-now);
      $('khBar').style.width=(left/(q.time*1000)*100)+'%';$('khTime').textContent=Math.ceil(left/1000);
      if(S.answered){
        opts.hidden=true;ans.hidden=false;
        $('khWaitT').textContent=S.timeup?'⏱ Vaqt tugadi':'✓ Javob yuborildi';
        $('khWaitS').textContent=(s.answerCount||0)+' / '+s.players.length+' ishtirokchi javob berdi';
      }else if(left<=0){
        opts.hidden=true;ans.hidden=false;
        $('khWaitT').textContent='⏱ Vaqt tugadi';$('khWaitS').textContent='Natijalar hisoblanmoqda…';
      }else{opts.hidden=false;ans.hidden=true}
    }
  }else if(s.status==='reveal'&&s.reveal){
    var r=Math.max(0,Math.ceil((s.revealEndsAt-now)/1000));
    $('khNext').textContent=(s.questionIndex+1>=s.questionCount?'Yakuniy natijalar ':'Keyingi savol ')+r+' soniyadan keyin';
  }
}

/* ---------- Natija ---------- */
function rowEl(i,p,isMe){
  var r=el('div','kh-row'+(isMe?' me':''));
  r.appendChild(el('span','n',String(i)));r.appendChild(el('span','nm',p.name));r.appendChild(el('span','sc',p.score+' ball'));
  return r;
}
function renderReveal(s){
  var r=s.reveal,mine=s.mine,res=null;
  if(mine)res={c:!!mine[1],p:Number(mine[2])||0};
  else if(S.myAns)res={c:!!S.myAns.correct,p:Number(S.myAns.points)||0};
  $('khRes').className='kh-res '+(res?(res.c?'ok':'bad'):'none');
  $('khResT').textContent=res?(res.c?'✓ To‘g‘ri!':'✗ Noto‘g‘ri'):'⏱ Javob berilmadi';
  $('khResS').textContent=res&&res.c?('+'+res.p+' ball'):'0 ball';
  var corr=$('khCorrect');
  if(r.type==='type'){
    corr.textContent=r.correctText+((r.accepted&&r.accepted.length>1)?'  (yoki: '+r.accepted.slice(1).join(', ')+')':'');corr.style.color='';
  }else{
    var ci=r.correctIndex,tf=r.type==='tf';
    corr.textContent=(tf?(ci===0?'✔ ':'✖ '):SHAPES[ci]+' ')+r.correctText;
    corr.style.color=tf?(ci===0?COLORS[1]:COLORS[0]):COLORS[ci];
  }
  var dist=$('khDist');empty(dist);
  if(r.dist){
    var mx=Math.max.apply(null,r.dist.concat([1]));
    r.options.forEach(function(t,i){
      var tf=r.type==='tf',col=tf?(i===0?COLORS[1]:COLORS[0]):COLORS[i];
      var row=el('div','kh-dr'),bar=el('span','t'),fill=el('i');
      fill.style.width=(r.dist[i]/mx*100)+'%';fill.style.background=col;bar.appendChild(fill);
      row.appendChild(el('span','l',tf?(i===0?'✔':'✖'):SHAPES[i]));row.appendChild(bar);
      row.appendChild(el('span','c',(i===r.correctIndex?'✓ ':'')+r.dist[i]));dist.appendChild(row);
    });
  }
  var rk=rankOf(s),m=me(s);
  $('khMyRank').textContent=rk?('Sizning o‘rningiz: '+rk+' · '+(m?m.score:0)+' ball'):'';
  var top=$('khTop');empty(top);
  s.players.slice(0,5).forEach(function(p,i){top.appendChild(rowEl(i+1,p,p.id===S.pid))});
  if(rk>5&&m)top.appendChild(rowEl(rk,m,true));
}

/* ---------- Yakun ---------- */
function renderEnd(s){
  var pod=$('khPodium');empty(pod);
  var order=[1,0,2];
  order.forEach(function(idx){
    var p=s.players[idx];if(!p)return;
    var d=el('div','kh-pod p'+(idx+1));
    d.appendChild(el('div','nm',p.name));d.appendChild(el('div','blk',['🥇','🥈','🥉'][idx]));d.appendChild(el('div','sc',p.score+' ball'));
    pod.appendChild(d);
  });
  var rk=rankOf(s),m=me(s);
  $('khEndMe').textContent=rk?('Sizning o‘rningiz: '+rk+' · '+(m?m.score:0)+' ball'):'';
  var f=$('khFinal');empty(f);
  s.players.slice(0,10).forEach(function(p,i){f.appendChild(rowEl(i+1,p,p.id===S.pid))});
  if(rk>10&&m)f.appendChild(rowEl(rk,m,true));
}

/* ---------- Hodisalar ---------- */
$('khCode').addEventListener('input',function(){this.value=this.value.toUpperCase().replace(/[^A-Z0-9]/g,'')});
$('khCode').addEventListener('keydown',function(e){if(e.key==='Enter')step1()});
$('khName').addEventListener('keydown',function(e){if(e.key==='Enter')step2()});
$('khGo1').addEventListener('click',step1);
$('khGo2').addEventListener('click',step2);
$('khBack').addEventListener('click',function(){note('');screen('khJ1')});
$('khLeave').addEventListener('click',function(){leave('')});
$('khAgain').addEventListener('click',function(){leave('')});

/* ---------- Sahifa yangilansa o‘yinni davom ettirish ---------- */
var sv=loadSaved();
if(sv&&sv.code&&sv.pid){
  api('lbState',{code:sv.code,playerId:sv.pid}).then(function(s){
    var inRoom=(s.players||[]).some(function(p){return p.id===sv.pid});
    if(!inRoom||s.status==='finished'){save(null);return}
    S.code=sv.code;S.pid=sv.pid;S.name=sv.name||'';begin();
  }).catch(function(e){if(/Xona topilmadi/.test(e.message))save(null)});
}
})();
</script>
