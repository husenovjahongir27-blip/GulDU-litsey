<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jonli bellashuv — Test Markaz Edu</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#172033;--muted:#667085;--line:#e4e8f0;--blue:#3457d5;--green:#12805c;--red:#c0392b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:980px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}.brand{font-weight:800;font-size:22px}.pill{background:#e8edff;color:#2947b8;padding:5px 10px;border-radius:999px;font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 5px 20px #15254a08}.card h2{margin:0 0 14px;font-size:20px}label{display:block;font-size:13px;font-weight:650;margin:12px 0 5px}input,select{width:100%;border:1px solid #ccd3e0;border-radius:10px;padding:12px;font:inherit;background:#fff}button{border:0;border-radius:11px;padding:12px 16px;background:var(--blue);color:white;font:inherit;font-weight:750;cursor:pointer;margin-top:12px}button:disabled{opacity:.5;cursor:wait}.secondary{background:#eef1f8;color:#27334a}.msg{margin-top:12px;color:var(--muted);white-space:pre-wrap}.hide{display:none!important}.question{font-size:clamp(22px,4vw,34px);font-weight:800;margin:12px 0 22px}.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.opt{padding:18px 12px;min-height:80px;border-radius:14px;background:#edf1ff;color:#1d2c63;border:2px solid transparent;text-align:left}.opt:nth-child(2){background:#ffeded;color:#7b2626}.opt:nth-child(3){background:#e6f8ef;color:#12593e}.opt:nth-child(4){background:#fff4d8;color:#76540c}.opt:disabled{opacity:.7}.score{font-size:28px;font-weight:850}.rank{display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid var(--line);gap:12px}.rank:first-child{font-weight:800}.status{font-weight:750}.small{font-size:13px;color:var(--muted)}@media(max-width:520px){.wrap{padding:12px}.opts{grid-template-columns:1fr}.card{padding:15px}}
</style></head><body><div class="wrap"><header class="top"><div><div class="brand">🎯 Test Markaz Edu</div><div class="small">Jonli bellashuv</div></div><span class="pill">Google Sheets rejimi · polling</span></header>
<div id="setup" class="grid"><section class="card"><h2>🎓 O‘qituvchi</h2><div class="small">Mavjud o‘qituvchi sessiya tokeni va test ID kerak.</div><label>O‘qituvchi tokeni</label><input id="token" autocomplete="off" placeholder="Sessiya tokeni"><label>Test ID</label><input id="testId" placeholder="Masalan: TEST_..." autocomplete="off"><button id="createBtn" onclick="createRoom()">Bellashuv xonasini yaratish</button><div id="hostMsg" class="msg"></div></section>
<section class="card"><h2>🙋 O‘quvchi</h2><label>Xona kodi</label><input id="joinCode" maxlength="6" placeholder="6 belgili kod" autocapitalize="characters"><label>Ism-familiya</label><input id="playerName" maxlength="50" placeholder="Ismingiz"><label>Sinf</label><input id="playerGroup" placeholder="Masalan: 101"><button onclick="joinRoom()">Bellashuvga qo‘shilish</button><div id="joinMsg" class="msg"></div></section></div>
<section id="game" class="card hide" style="margin-top:16px"><div class="top"><div><div class="small">XONA KODI</div><div id="roomCode" class="score">------</div></div><div><div class="small">HOLAT</div><div id="status" class="status">Kutilmoqda</div></div><div id="scoreBox"><div class="small">BALL</div><div id="myScore" class="score">0</div></div></div><div id="waiting"><h2>O‘yin boshlanishini kuting…</h2><div id="playersWaiting" class="msg"></div><button id="startBtn" class="hide" onclick="startGame()">Bellashuvni boshlash</button></div><div id="playArea" class="hide"><div id="qcount" class="pill"></div><div id="question" class="question"></div><img id="qimg" class="hide" style="max-width:100%;max-height:260px;border-radius:12px" alt="Savol rasmi"><div id="options" class="opts"></div><div id="feedback" class="msg"></div><div id="reveal" class="msg"></div><div id="hostControls" class="hide"><button id="nextBtn" onclick="nextStep()">Javoblarni ko‘rsatish</button></div></div><div id="finished" class="hide"><h2>🏆 Bellashuv yakunlandi!</h2><p>Yakuniy natijalar:</p></div><h2 style="margin-top:22px">🏅 Reyting</h2><div id="leaderboard"></div></section></div>
<script>
// Shu URL mavjud Test Markaz Edu saytidagi RESULT_API_URL bilan bir xil bo‘lishi kerak.
const API_URL='https://script.google.com/macros/s/AKfycbwhAIWrqNJPK-tTajCs7Cj-dE7Hc0qVs6w0_qPrpLjHS5ZYOr9kIoeE6GN9Cx4WhFE/exec';
let mode='',code='',playerId='',token='',lastQuestion=-999,answered=false,pollTimer=null,lastStatus='';
async function api(action,payload={}){const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,...payload})});const d=JSON.parse(await r.text());if(!d||d.ok===false)throw Error(d?.error||'Server xatosi');return d}
function say(id,msg){document.getElementById(id).textContent=msg}
async function createRoom(){token=document.getElementById('token').value.trim();const testId=document.getElementById('testId').value.trim();if(!token||!testId)return say('hostMsg','Token va test ID ni kiriting.');const b=document.getElementById('createBtn');b.disabled=true;try{const r=await api('lbCreate',{token,testId});mode='host';code=r.code;document.getElementById('hostMsg').textContent='Xona yaratildi. O‘quvchilarga kodni bering: '+code+'\nSavollar: '+r.questionCount;enterGame();document.getElementById('startBtn').classList.remove('hide');startPolling()}catch(e){say('hostMsg',e.message)}finally{b.disabled=false}}
async function joinRoom(){code=document.getElementById('joinCode').value.trim().toUpperCase();const name=document.getElementById('playerName').value.trim(),group=document.getElementById('playerGroup').value.trim();if(!code||!name||!group)return say('joinMsg','Xona kodi, ism va sinfni kiriting.');try{const r=await api('lbJoin',{code,name,group});mode='player';playerId=r.playerId;enterGame();startPolling()}catch(e){say('joinMsg',e.message)}}
function enterGame(){document.getElementById('setup').classList.add('hide');document.getElementById('game').classList.remove('hide');document.getElementById('roomCode').textContent=code;document.getElementById('hostControls').classList.toggle('hide',mode!=='host');document.getElementById('scoreBox').classList.toggle('hide',mode!=='player')}
function startPolling(){if(pollTimer)clearInterval(pollTimer);refresh();pollTimer=setInterval(refresh,2500)}
async function refresh(){try{const s=await api('lbState',{code,playerId});document.getElementById('startBtn').classList.toggle('hide',mode!=='host'||s.status!=='lobby');document.getElementById('status').textContent=({lobby:'O‘quvchilar yig‘ilmoqda',question:'Savol faol',reveal:'Javoblar ko‘rsatilmoqda',finished:'Yakunlandi'})[s.status]||s.status;document.getElementById('myScore').textContent=(s.players.find(p=>p.id===playerId)||{}).score||0;document.getElementById('playersWaiting').textContent='Ishtirokchilar: '+s.players.length;document.getElementById('leaderboard').innerHTML=s.players.map((p,i)=>`<div class="rank"><span>${i+1}. ${esc(p.name)} <span class="small">(${esc(p.group)})</span></span><strong>${p.score} ball</strong></div>`).join('')||'<p class="small">Hozircha ishtirokchi yo‘q.</p>';
const waiting=s.status==='lobby';document.getElementById('waiting').classList.toggle('hide',!waiting);document.getElementById('playArea').classList.toggle('hide',waiting||s.status==='finished');document.getElementById('finished').classList.toggle('hide',s.status!=='finished');
if(s.status==='question'&&s.question){const q=s.question;if(lastQuestion!==s.questionIndex){lastQuestion=s.questionIndex;answered=!!s.answered;document.getElementById('qcount').textContent=`Savol ${q.number} / ${s.questionCount}`;document.getElementById('question').textContent=q.q;const im=document.getElementById('qimg');if(q.img){im.src=q.img;im.classList.remove('hide')}else{im.removeAttribute('src');im.classList.add('hide')}document.getElementById('reveal').textContent='';document.getElementById('feedback').textContent='';document.getElementById('options').innerHTML=q.options.map((v,i)=>`<button class="opt" ${mode==='host'||answered?'disabled':''} onclick="sendAnswer(${i})">${['🅰️','🅱️','🅲','🅳'][i]} ${esc(v)}</button>`).join('');document.getElementById('nextBtn').textContent='Javoblarni ko‘rsatish'}else if(mode==='player'&&s.answered&&!answered){answered=true;disableOptions()}}
if(s.status==='reveal'&&s.reveal){document.getElementById('reveal').textContent='To‘g‘ri javob: '+s.reveal.correctText;document.getElementById('nextBtn').textContent=s.questionIndex+1>=s.questionCount?'Bellashuvni yakunlash':'Keyingi savol'}
if(s.status==='finished'&&pollTimer){clearInterval(pollTimer);pollTimer=null}
}catch(e){say('feedback','Ulanish muammosi: '+e.message)}}
async function startGame(){try{await api('lbStart',{code,token});document.getElementById('startBtn').classList.add('hide');lastQuestion=-999;await refresh()}catch(e){say('hostMsg',e.message)}}
async function sendAnswer(choice){if(answered||mode!=='player')return;answered=true;disableOptions();try{const r=await api('lbAnswer',{code,playerId,choice});say('feedback',r.correct?'✅ To‘g‘ri! +'+r.points+' ball':'❌ Bu javob noto‘g‘ri. '+r.points+' ball')}catch(e){answered=false;say('feedback',e.message)}}
function disableOptions(){document.querySelectorAll('#options button').forEach(b=>b.disabled=true)}
async function nextStep(){try{const s=await api('lbState',{code});const r=await api('lbNext',{code,token});if(r.status==='finished'){await refresh()}else{lastQuestion=-999;await refresh()}}catch(e){say('feedback',e.message)}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
</script></body></html>
